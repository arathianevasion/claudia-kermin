// Claudia's crew role: the union of the stock Pilot, Engineer and Scientist effects
// (GameData/Squad/Experience/Traits.cfg). Breaking Ground effects are left out.
// Where two stock traits give the same effect, the better one wins:
//   GeeForceTolerance uses Pilot's table; EVAChuteSkill is available from level 0 (Pilot's).
// Config-only: there is no C# subclass. The roster scenario module keeps this trait off every
// other Kerbal (see ClaudiaKermin.Adapter/Roster).

EXPERIENCE_TRAIT
{
	name = SuperIntelligence
	title = Super Intelligence
	desc = Claudia is a mission controller with the skills of a Pilot, an Engineer and a Scientist.

	// Pilot
	EFFECT
	{
		name = AutopilotSkill
	}
	EFFECT
	{
		name = FullVesselControlSkill
	}
	EFFECT
	{
		name = GeeForceTolerance
		modifiers = 1.3, 1.45, 1.6, 1.85, 2.0
	}
	EFFECT
	{
		name = EVAChuteSkill
		level = 0
	}

	// Engineer
	EFFECT
	{
		name = RepairSkill
	}
	EFFECT
	{
		name = ConverterSkill
	}
	EFFECT
	{
		name = DrillSkill
	}
	EFFECT
	{
		name = FailureRepairSkill
	}

	// Scientist
	EFFECT
	{
		name = VesselScienceReturn
		modifiers = 1.05, 1.1, 1.15, 1.2, 1.25
	}
	EFFECT
	{
		name = PartScienceReturn
		modifiers = 1.05, 1.1, 1.15, 1.2, 1.25
	}
	EFFECT
	{
		name = ScienceSkill
	}
	EFFECT
	{
		name = ScienceResetSkill
	}
	EFFECT
	{
		name = SpecialExperimentSkill
	}
	EFFECT
	{
		name = ExternalExperimentSkill
	}
}
