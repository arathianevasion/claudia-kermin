// Community Trait Icons compatibility (ModuleManager only; does nothing without CTI).
// Registers an icon for the Super Intelligence trait, which CTI reads from
// GameData/<mod>/ icons named by trait. The icon ships at ClaudiaKermin/Icons/SuperIntelligence.png.
// UNVERIFIED: the CTI node and key names below are from memory of its README, and CTI was not
// available when this was written. Check against CTI's own cfg before release (in-game check
// in the ticket notes).

@COMMUNITYTRAITICONS:NEEDS[CommunityTraitIcons]:FOR[ClaudiaKermin]
{
	TRAIT
	{
		name = SuperIntelligence
		icon = ClaudiaKermin/Icons/SuperIntelligence
	}
}
