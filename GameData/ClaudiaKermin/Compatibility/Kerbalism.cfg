// Kerbalism compatibility (ModuleManager only; does nothing without Kerbalism).
// Kerbalism matches crew by trait name in "crew spec" strings such as `Engineer` or `Engineer@3`
// (role, optional minimum level), joined with `|` for OR. Wherever a module asks for a single
// Pilot, Engineer or Scientist, add Super Intelligence at the same level as an alternative:
//   crew_operate = Engineer@3   ->   crew_operate = Engineer@3|SuperIntelligence@3
// UNVERIFIED against a live Kerbalism install (ModuleManager and Kerbalism were not available when
// this was written): see the in-game checks in README / the ticket.
// Values already containing `|` or `&` are left alone.

@PART[*]:HAS[@MODULE[*]:HAS[#crew_operate]]:NEEDS[Kerbalism]:FOR[ClaudiaKermin]
{
	@MODULE[*]:HAS[#crew_operate]
	{
		@crew_operate ^= :^(Pilot|Engineer|Scientist)(@\d+)?$:$1$2|SuperIntelligence$2:
	}
}

@PART[*]:HAS[@MODULE[*]:HAS[#crew_reset]]:NEEDS[Kerbalism]:FOR[ClaudiaKermin]
{
	@MODULE[*]:HAS[#crew_reset]
	{
		@crew_reset ^= :^(Pilot|Engineer|Scientist)(@\d+)?$:$1$2|SuperIntelligence$2:
	}
}

@PART[*]:HAS[@MODULE[*]:HAS[#crew_repair]]:NEEDS[Kerbalism]:FOR[ClaudiaKermin]
{
	@MODULE[*]:HAS[#crew_repair]
	{
		@crew_repair ^= :^(Pilot|Engineer|Scientist)(@\d+)?$:$1$2|SuperIntelligence$2:
	}
}
