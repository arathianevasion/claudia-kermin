# exec_node block test (debug_tools). The runner loads scenario.sfs, spawns reference.craft into
# a circular orbit, runs test.ks bundled with the Core Library, and judges its Script Result
# against the contract ranges below. Spec: exec_node residual under 0.5 m/s.
block = exec_node
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: the node is 10 minutes of game time ahead.
timeout_s = 600
check = success == true
check = residual < 0.5
check = burn_time > 0
check = node_dv > 100
check = dv_used > 100
check = orbit.ap > 150000
# Spec #314's targets: the burn starts on time, and the craft was aligned before every warp.
check = late_start_s == 0
check = not_aligned == 0
# The turn took no longer than TURNTIME predicted (test.ks compares them).
check = test_turn_within == true
# The warp trace (#335): exec_node turns to the node before it warps (#343), so the first request comes
# within 10 real seconds plus the turn (at most 120 s) of exec_node starting.
check = warp.first_request_real_s < 130
