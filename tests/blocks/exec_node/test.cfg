# exec_node block test (debug_tools). The runner loads scenario.sfs, spawns reference.craft into
# a circular orbit, runs test.ks bundled with the Core Library, and judges its Script Result
# against the contract ranges below. Spec: exec_node residual under 0.5 m/s.
block = exec_node
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: the node is 10 minutes of game time ahead.
timeout_s = 600
check = success == true
check = residual < 0.5
check = burn_time > 0
check = dv_used > 100
check = orbit.ap > 150000
