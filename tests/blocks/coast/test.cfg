# coast block test (debug_tools): the 3-orbit hold, then deorbit, of issue #150 as one script. The
# runner loads scenario.sfs, spawns reference.craft (exec_node's) into a circular orbit, runs test.ks
# bundled with the Core Library, and judges its Script Result against the ranges below. The hold is
# longer than an orbit, so it passes only with the wait cap gone and in-script warp working (ADR 0004).
block = coast
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: about 1.6 h of game time on rails, then a burn 5 minutes ahead.
timeout_s = 900
check = success == true
# Three orbits at 100 km: the period is 2 pi sqrt(r^3 / mu) = 2 pi sqrt(700000^3 / 3.5316e12) = 1958 s,
# so the hold is 3 x 1958 = 5874 s (the #214 run coasted 5874.4); about 5% either side.
check = coasted > 5500
check = coasted < 6300
check = residual < 0.5
check = orbit.pe < 45000
# The warp trace (#335): the hold asks for warp within 10 real seconds of coast starting (spec #314's target).
check = warp.first_request_real_s < 10
