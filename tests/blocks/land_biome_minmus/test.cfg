# land block test (debug_tools): a biome target at Minmus (#281). As land_biome_mun (the same lander, with its Small Inline
# Reaction Wheel for torque), in a 30 km equatorial Minmus orbit, landing in the Flats in daylight. Minmus is small and light
# (g 0.49 m/s^2): the LV-909 gives this lander a TWR of about 20, so this also flies land's descent far from the Mun's figures.
block = land
craft = reference.craft
orbit_body = Minmus
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: up to 3 orbits (about 3.4 h of game time) on rails to the pass, then the powered descent.
timeout_s = 2400
check = success == true
check = situation == LANDED
check = in_biome == true
check = sun_up == true
check = distance_to_target < 5000
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = slope < 15
check = brakes_before_impact == true
check = reversals == 0
check = lean >= 0
check = lean < 15
# dv_used: a 30 km Minmus orbit moves at about 140 m/s; the deorbit, correction and descent are a few hundred m/s at most.
check = dv_used > 50
check = dv_used < 400
