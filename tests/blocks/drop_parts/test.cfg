# drop_parts block test (debug_tools): the drop_parts block of issue #279. reference.craft is the
# launch_orbit craft with the name tag "spent" on its first-stage tank (a KOSNameTag module); it arrives
# in a 100 km circular Kerbin orbit with no stage fired. drop_parts must fire the decoupler above that
# tank, which takes the first stage (tank, engine, decoupler's lower side, three winglets) and reports it,
# and a name nothing carries must fail without dropping anything.
block = drop_parts
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
timeout_s = 120
check = success == true
check = parts_dropped > 0
check = parts_dropped < 6
check = test_report_matches == true
check = test_tagged_left == 0
# The probe stack and second stage stay: 15 parts less the first stage.
check = test_parts_left > 8
check = test_missing_failed == true
check = test_missing_dropped_nothing == true
