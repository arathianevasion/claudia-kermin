# return block test (debug_tools). The runner loads scenario.sfs, spawns reference.craft into a
# circular Mun orbit, runs test.ks bundled with the Core Library, and judges its Script Result
# against the contract ranges below. Spec: return aims for a 35 km Kerbin periapsis (landing
# anywhere) with a mid-course correction, ending before reentry.
block = return
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: up to an orbit's wait to eject, the climb out of the Mun's sphere of
# influence, then about 4 h of game time to the correction halfway home.
timeout_s = 1200
check = success == true
# Out of the Mun's sphere of influence (the correction waits for that) and not yet down.
check = body == Kerbin
check = kerbin_pe > 25000
check = kerbin_pe < 45000
check = reentry_ut > 0
check = dv_used > 250
check = dv_used < 450
