# land block test (debug_tools): a chosen site. The runner loads scenario.sfs, spawns
# reference.craft (a small lander) into a 30 km equatorial Mun orbit, runs test.ks bundled with the
# Core Library, and judges its Script Result against the contract ranges below. Spec: land within
# 5 km, touching down at about 2 m/s.
block = land
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: up to an orbit's wait on rails, then a few minutes of powered descent.
timeout_s = 1500
check = success == true
check = situation == LANDED
check = distance_to_target < 5000
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = slope < 15
check = dv_used > 400
check = brakes_before_impact == true
