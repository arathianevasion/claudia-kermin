# land block test (debug_tools): a chosen site. The runner loads scenario.sfs, spawns
# reference.craft (a small lander) into a 30 km equatorial Mun orbit, runs test.ks bundled with the
# Core Library, and judges its Script Result against the contract ranges below. Spec: land within
# 5 km, touching down at about 2 m/s.
block = land
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: up to an orbit's wait on rails, then a few minutes of powered descent.
timeout_s = 1500
check = success == true
check = situation == LANDED
check = distance_to_target < 5000
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = slope < 15
check = brakes_before_impact == true
# #233: one brake and straight down, no swinging back over the site.
check = reversals == 0
# Sideways speed at touchdown (-1 if it never touched down). The descent nulls it before the last
# 100 m and holds the craft within a few degrees of upright below 40 m; the simulated descent
# (LandAscendTests) touches down under 0.1 m/s even with a 2 s turn lag, so 0.5 m/s is a fault.
check = touchdown_h_speed >= 0
check = touchdown_h_speed < 0.5
# Degrees from upright once settled: the slope (max_slope 8) plus the legs' give; over 15 is tipping.
check = lean >= 0
check = lean < 15
# dv_used: the deorbit burn from 30 km circular (532 m/s) to a periapsis 3 km over the site is
# 17 m/s; the correction burn for an equatorial site from an equatorial orbit is a few m/s; the
# powered descent cancels about 575 m/s across the ground (584 m/s at periapsis less the Mun's
# 9 m/s turn) and holds the craft up while it brakes and comes down, about 710 m/s simulated for
# this lander (LandAscendTests). About 730 m/s in all; 900 leaves 20% for steering losses and real
# terrain. Before #233 the swinging descent used 1226 m/s.
check = dv_used > 400
check = dv_used < 900
# Physics warp (#341): the low vacuum fall runs at up to 4x, 2x from 60 s before braking and 1x from 30 s (land_warp_cap).
check = warp.physics_max_rate <= 4
