# launch no-flip block test (debug_tools): the #41 failure. A craft with no fins launches from
# Kerbin's pad with throttle_max_q forcing a throttle-down in thick air; it must hold max_aoa (5
# degrees, with slack for steering lag) all the way up and through the coast, and its thrust must
# not drop below its weight while burning in thick air. Its only torque is the engine gimbal (which
# the thrust floor keeps alive) and a Small Inline Reaction Wheel: the OKTO2 core has none (6a-fix5).
block = launch
craft = reference.craft
start = launchpad
timeout_s = 600
check = success == true
check = test_max_aoa < 10
check = test_min_twr > 0.95
check = max_q < 15000
check = coast_ap >= 60000
check = ap_error > -3000
