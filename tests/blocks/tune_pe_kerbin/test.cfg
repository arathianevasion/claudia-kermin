# tune_pe block test, patch current (debug_tools). The runner loads scenario.sfs, spawns reference.craft
# into a circular 30 km Mun orbit and runs test.ks bundled with the Core Library: return brings it into
# Kerbin's sphere of influence with a 35 km periapsis, then tune_pe moves that periapsis to 45 km with a
# burn placed before that periapsis (it is inside the atmosphere, so an apoapsis burn would come too late).
# The craft has a probe core and a SAS module for torque.
block = tune_pe
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: as return (about 1200), then the wait on rails to the burn.
timeout_s = 2400
check = success == true
check = body == Kerbin
check = pe_actual > 44000
check = pe_actual < 46000
check = burn_ut > 0
# A 10 km move of the periapsis a couple of minutes on from the pass costs well under 50 m/s.
check = dv_used > 0
check = dv_used < 50
