# ascend block test (debug_tools). The runner can only spawn craft into orbit, so test.ks first
# lands the reference lander anywhere on the Mun with land, then flies ascend from there and
# reports ascend's Script Result (or land's, if the landing failed). The runner loads scenario.sfs,
# spawns reference.craft into a 30 km equatorial Mun orbit, runs test.ks bundled with the Core
# Library, and judges the result against the contract ranges below. Spec: ascend reaches
# target_alt (default 5 km above the highest terrain) above the highest terrain.
block = ascend
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: a landing, then a climb and a coast to apoapsis.
timeout_s = 2400
check = success == true
check = situation == ORBITING
check = ap_error > -1000
check = ap_error < 1000
check = orbit.pe > 7100
check = orbit.inc < 2
# #233: the landing before it, as the land tests check it (see land's test.cfg for the figures).
# test.ks copies land's results in as land_*, and reports land's own (success false) instead of
# taking off when the lander came down leaning 15 degrees or more.
check = land_reversals == 0
check = land_touchdown_h_speed >= 0
check = land_touchdown_h_speed < 0.5
check = land_lean >= 0
check = land_lean < 15
check = land_dv_used < 900
