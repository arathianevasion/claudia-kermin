# land block test (debug_tools): anywhere, in daylight. The runner loads scenario.sfs, spawns
# reference.craft (a small lander) into a 30 km equatorial Mun orbit, runs test.ks bundled with the
# Core Library, and judges its Script Result against the contract ranges below. An equatorial orbit
# crosses the day side every orbit, so a daylight touchdown is always within an orbit.
block = land
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
timeout_s = 1500
check = success == true
check = situation == LANDED
check = distance_to_target < 5000
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = slope < 15
