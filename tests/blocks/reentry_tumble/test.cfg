# reentry_tumble block test (debug_tools). The reentry_hop fall, started tumbling: the craft is spun at
# 40 deg/s about its pitch axis as the script starts, and starts inside the atmosphere (60 km apoapsis,
# periapsis 200 km underground) so there is no on-rails wait to stop the spin first. reentry must get the
# heat shield forward with the reaction wheel (a tumbling craft is what let a parachute open late and fast
# in the #41 check), drop the shield, open the drogue and main parachutes by speed and pressure (or by
# their last heights) and touch down under a safe speed. Spec: reentry reports max g, max temperature, geo.
block = reentry
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 60000
orbit_pe = -200000
orbit_inclination = 0
tumble_rate = 40
# Real seconds: about a minute of fall, then a slow chute descent.
timeout_s = 900
check = success == true
check = touchdown_speed < 12
check = max_g > 0
check = max_g < 20
check = geo.alt < 100
check = parts_after < parts_before
