# reentry_orbit block test (debug_tools). A return from orbit: the probe starts at the 150 km apoapsis
# of an orbit with a 20 km periapsis, so it coasts half an orbit (on-rails warp, 1x for the last 30 s)
# and enters the atmosphere at about 2.2 km/s. reentry must hold retrograde, drop the heat shield by
# its stage number (jettison_stage 1), open the parachute safely and land with the heat shield
# having absorbed the heating. Spec: reentry reports max g, max temperature, geo, splashed.
block = reentry
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 150000
orbit_pe = 20000
orbit_inclination = 0
# Real seconds: half an orbit of warp, the entry, then a slow chute descent.
timeout_s = 1200
check = success == true
check = touchdown_speed < 12
check = max_g > 0.5
check = max_g < 20
check = max_temp_pct < 100
check = landed_or_splashed == true
check = parts_dropped >= 1
check = shield_dropped == true
