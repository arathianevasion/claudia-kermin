# launch vertical hop block test (debug_tools): a craft hops straight up from Kerbin's pad to an 8 km
# apoapsis, cutting off in thick air and coasting smoothly to the top, where launch ends. The #41
# hop flipped to 176 degrees off vertical after its throttle collapsed. The craft has fins: the coast
# is unpowered at up to ~40 kPa, where a finless craft (whose only torque is its gimbal and a small
# reaction wheel) tumbles whatever the steering does (6a-fix5).
block = launch
craft = reference.craft
start = launchpad
timeout_s = 300
check = success == true
# launch cuts off within launch_cutoff_tol (50 m at 8 km) under target_ap (#234)
check = coast_ap >= 7900
check = test_max_tilt < 10
check = test_min_twr > 0.95
check = test_top_alt > 6000
check = test_top_alt < 9000
check = dv_used < 1200
# Physics warp on the arc (#339): never above 4x (no rails in the air), and the q rule's rates reached near the top.
check = warp.max_rate <= 4
check = warp.physics_max_rate >= 2
