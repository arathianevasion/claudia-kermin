# launch vertical hop block test (debug_tools): a craft with no fins hops straight up from Kerbin's
# pad to an 8 km apoapsis, cutting off in thick air and coasting smoothly to the top, where launch
# ends. The #41 hop flipped to 176 degrees off vertical after its throttle collapsed.
block = launch
craft = reference.craft
start = launchpad
timeout_s = 300
check = success == true
check = coast_ap >= 8000
check = test_max_tilt < 10
check = test_min_twr > 0.95
check = test_top_alt > 6000
check = test_top_alt < 9000
check = dv_used < 1200
