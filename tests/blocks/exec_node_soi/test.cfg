# exec_node_soi block test (debug_tools, #344): a node beyond an SOI change. reference.craft is the
# launch_orbit craft (it has a Small Inline Reaction Wheel to turn with), spawned in a 50 km circular Mun
# orbit. test.ks flies a 300 m/s prograde escape node, then plans a 20 m/s prograde node in Kerbin's SOI,
# 900 s after the SOI change, and flies it: exec_node warps to the change, lets warp settle, turns, and
# warps on. The result is the second burn's.
block = exec_node
craft = reference.craft
orbit_body = Mun
orbit_altitude = 50000
orbit_inclination = 0
# Real seconds, warp included: the SOI change is a couple of game hours away.
timeout_s = 900
check = success == true
check = residual < 0.5
check = node_dv > 15
# Spec #314's targets: the burn starts on time, and no turn was given up.
check = late_start_s == 0
check = not_aligned == 0
# The burn was flown in Kerbin's SOI, past the change (test.ks).
check = test_past_soi == true
check = test_turn_within == true
