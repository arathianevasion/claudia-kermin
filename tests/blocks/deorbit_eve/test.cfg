# deorbit block test, Eve (debug_tools): see deorbit_kerbin/test.cfg for how it runs. From a 120 km
# circular equatorial orbit (Eve's air is 90 km deep) deorbit burns for 0 N, 0 E to a 27 km periapsis;
# reentry lands it. Eve's dense air and fast entry stretch the predictor most.
block = deorbit
craft = reference.craft
orbit_body = Eve
orbit_altitude = 120000
orbit_inclination = 0
# Real seconds, warp included: up to a turn of Eve (about 22 h) on rails to the burn, then the entry
# and a slow parachute descent.
timeout_s = 3000
check = success == true
check = burn_ut > 0
check = predicted_error_km < 10
# About 100 m/s from 120 km to a 27 km periapsis.
check = dv_used > 50
check = dv_used < 200
check = landed_or_splashed == true
check = miss_km < 25
check = target_km < 50
