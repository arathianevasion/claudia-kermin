# deorbit block test, Laythe (debug_tools): see deorbit_kerbin/test.cfg for how it runs. From an 80 km
# circular equatorial orbit (Laythe's air is 50 km deep) deorbit burns for 0 N, 0 E to a 15 km
# periapsis, within a max_wait of 6 h; reentry lands it, most likely in the sea.
block = deorbit
craft = reference.craft
orbit_body = Laythe
orbit_altitude = 80000
orbit_inclination = 0
# Real seconds, warp included: up to 6 h on rails to the burn, then the entry and the parachute descent.
timeout_s = 2400
check = success == true
check = burn_ut > 0
check = predicted_error_km < 10
# About 55 m/s from 80 km to a 15 km periapsis.
check = dv_used > 20
check = dv_used < 120
check = landed_or_splashed == true
check = miss_km < 25
check = target_km < 50
