# reentry_hop block test (debug_tools). A suborbital hop: the probe starts at the 100 km apoapsis of
# an orbit whose periapsis is 200 km below the ground, so it falls straight back through the
# atmosphere. reentry must hold the heat shield forward, drop it, open the parachute by speed and
# air pressure (never late after a tumble: the failure seen in the #41 check was a 90 m/s splashdown)
# and touch down under a safe speed. Spec: reentry reports max g, max temperature, geo, splashed.
block = reentry
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_pe = -200000
orbit_inclination = 0
# Real seconds: about a minute of fall, then a slow chute descent from 15 km or so.
timeout_s = 900
check = success == true
check = touchdown_speed < 12
check = max_g > 0
check = max_g < 15
check = max_temp_pct < 100
check = landed_or_splashed == true
check = parts_dropped >= 1
check = shield_dropped == true
