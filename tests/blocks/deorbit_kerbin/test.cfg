# deorbit block test, Kerbin to KSC (debug_tools). The runner loads scenario.sfs, spawns reference.craft
# into an 80 km circular equatorial orbit and runs test.ks bundled with the Core Library: deorbit burns
# for KSC and drops the spent tank and engine (separate 1), then reentry lands the capsule under its parachute. Logs
# predicted against actual: miss_km is the reentry predictor's error from the orbit actually flown,
# target_km the whole deorbit's. Kerbin first; then deorbit_eve, deorbit_duna and deorbit_laythe.
# The craft has a probe core and a SAS module for torque.
block = deorbit
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 80000
orbit_inclination = 0
# Real seconds, warp included: up to a turn of Kerbin (6 h) on rails to the burn, then the entry and a
# slow parachute descent.
timeout_s = 2400
check = success == true
check = burn_ut > 0
check = predicted_error_km < 10
# A retrograde burn from 80 km to a 21 km periapsis.
check = dv_used > 40
check = dv_used < 150
check = landed_or_splashed == true
# The research expects 5 to 15 km typical and 25 km at worst for the predictor alone; the spec's goal is 50 km of KSC.
check = miss_km < 25
check = target_km < 50
