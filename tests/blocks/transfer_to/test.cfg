# transfer_to block test (debug_tools). The runner loads scenario.sfs, spawns reference.craft into
# a circular orbit, runs test.ks bundled with the Core Library and RSVP, and judges its Script Result
# against the contract ranges below. Spec: transfer plans with RSVP, flies with exec_node, corrects
# halfway through the coast and ends before arrival; capture is circularize at pe, not tested here.
block = transfer_to
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: RSVP's search, up to an orbit's wait to depart, then about 3.5 h of
# game time to the correction halfway to the Mun.
timeout_s = 1200
check = success == true
# Still on the way: the sequence ends before the Mun's sphere of influence.
check = body == Kerbin
check = encounter_ut > 0
check = target_pe_actual > 20000
check = target_pe_actual < 40000
check = correction_dv >= 0
check = dv_used > 800
check = dv_used < 1100
# #225 instrumentation: the ejection node's dv, the burn's dv_used and burn time are in the result, so
# a failing run shows whether the burn wasted thrust (dv_used far above the node) or RSVP chose a
# costly node. No bound on them yet.
check = ejection_node_dv > 0
check = ejection_dv_used > 0
check = ejection_burn_time > 0
