# transfer_to block test (debug_tools). The runner loads scenario.sfs, spawns reference.craft into
# a circular orbit, runs test.ks bundled with the Core Library, and judges its Script Result
# against the contract ranges below. Spec: transfer finds its node with the ejection solver at once, flies with exec_node, corrects
# halfway through the coast and ends before arrival; capture is circularize at pe, not tested here.
block = transfer_to
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: up to an orbit wait to depart, then about 3.5 h of
# game time to the correction halfway to the Mun.
timeout_s = 1200
check = success == true
# Still on the way: the sequence ends before the Mun's sphere of influence.
check = body == Kerbin
check = encounter_ut > 0
check = target_pe_actual > 20000
check = target_pe_actual < 40000
check = correction_dv >= 0
check = dv_used > 800
check = dv_used < 1100
# #225 instrumentation: the ejection node's dv, the burn's dv_used and burn time are in the result, so
# a failing run shows whether the burn wasted thrust (dv_used far above the node) or the solver chose a
# costly node.
check = ejection_node_dv > 0
check = ejection_dv_used > 0
check = ejection_burn_time > 0
# #228: the node is about a Hohmann transfer. From r1 = 700 km (100 km over Kerbin's 600 km) to the
# Mun's r2 = 12,000 km, mu = 3.5316e12: circular speed sqrt(mu/r1) = 2246 m/s, transfer periapsis
# speed sqrt(mu * 2 * r2 / (r1 * (r1 + r2))) = 3088 m/s, so 842 m/s (delta-v maps say about 860).
# The previous search (a whole Mun period) planned 839 in-game; 900 leaves room for the 20 s between
# the departures this one tries.
check = ejection_node_dv < 900
# #346: window "next" is the next window, not the cheapest in a Mun orbit (one planned 60,159 s out
# and the run aborted on min_ec_pct before the burn). Windows come round every 1988 s from 100 km;
# the solver searches one synodic period from the block's start plus the turn time (at least 30 s),
# so the wait is at most one period plus the turn time. The node is found at once, so the first warp
# request comes in real seconds, not after a search.
check = ejection_wait > 0
check = ejection_wait < 2300
check = warp.first_request_real_s < 10
