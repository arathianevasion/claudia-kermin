# tune_pe block test, patch next (debug_tools). The runner loads scenario.sfs, spawns reference.craft
# into a circular 100 km Kerbin orbit and runs test.ks bundled with the Core Library and RSVP:
# transfer_to to a 30 km Mun periapsis, then tune_pe moves the Mun periapsis to 50 km before arrival.
# The craft has a probe core and a SAS module for torque.
block = tune_pe
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: as transfer_to (about 1200), then the wait to the burn halfway to the Mun.
timeout_s = 2400
check = success == true
# Still on the way: the burn is before the Mun's sphere of influence.
check = body == Kerbin
check = pe_actual > 49000
check = pe_actual < 51000
check = burn_ut > 0
# A 20 km move of the periapsis costs a few m/s; the limit is the default max_dv.
check = dv_used > 0
check = dv_used < 50
