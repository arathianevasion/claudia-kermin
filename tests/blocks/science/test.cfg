# science block test (debug_tools), Sandbox. The probe sits in a 100 km circular Kerbin orbit with a
# Magnetometer (rerunnable), Mystery Goo (not rerunnable) and a 2HOT thermometer (rerunnable).
# science("all_useful", keep) must run every experiment once (Sandbox tracks no science) and a second
# call must run none: every experiment holds data, and nothing is overwritten. transmit "keep"
# leaves the data on board. Spec: science runs each experiment once in Sandbox, never overwrites.
block = science
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
timeout_s = 300
check = success == true
check = ran >= 2
check = kept == ran
check = ran_again == 0
check = success_again == true
