# land block test (debug_tools): a biome target at the Mun (#281). The runner loads scenario.sfs, spawns reference.craft (the
# land test's lander: OKTO2, kOS, a Small Inline Reaction Wheel for torque, FL-T800, LV-909, legs) into a 30 km equatorial Mun
# orbit, runs test.ks bundled with the Core Library, and judges its Script Result against the contract ranges below. land
# finds a daylight Midlands site under the next 3 orbits (find_landing_site's search, a block-internal call) and flies it.
block = land
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: up to 3 orbits (about 2.3 h of game time) on rails to the pass, then the powered descent.
timeout_s = 2400
check = success == true
check = situation == LANDED
# The spec: it lands in the biome asked for, in daylight.
check = in_biome == true
check = sun_up == true
check = distance_to_target < 5000
check = touchdown_speed_actual > 0
check = touchdown_speed_actual < 3
check = slope < 15
check = brakes_before_impact == true
check = reversals == 0
check = lean >= 0
check = lean < 15
# The same orbit and descent as the land test (see its test.cfg for the figures); the wait is on rails.
check = dv_used > 400
check = dv_used < 900
