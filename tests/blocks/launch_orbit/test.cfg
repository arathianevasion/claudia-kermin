# launch + circularize block test (debug_tools): the craft starts on Kerbin's launch pad; launch to
# an 80 km apoapsis and circularize at ap, one Maneuver Sequence under one Approval.
# Spec: launch ends coasting out of the atmosphere; circularize within 1% eccentricity.
block = launch
craft = reference.craft
start = launchpad
# Real seconds: about 4 minutes of ascent and coast, then the wait to ap and the burn.
timeout_s = 900
check = success == true
check = ecc < 0.01
check = orbit.pe > 70000
check = orbit.ap < 95000
check = launch_success == true
check = launch_ap_error > -2000
check = launch_ap_error < 2000
check = launch_coast_ap >= 79000
# launch returned (#234): a throttle that trickled just under the target never returned, so circularize
# never ran; the whole launch, coast included, is bounded well inside the timeout.
check = launch_duration < 600
check = launch_max_q > 0
check = launch_dv_used > 1000
check = situation == ORBITING
# Physics warp on the coast (#339): never above 4x in launch (no rails in the air), and the q rule's rates reached.
check = warp.max_rate <= 4
check = warp.physics_max_rate >= 2
