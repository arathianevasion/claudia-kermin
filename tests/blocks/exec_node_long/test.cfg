# exec_node_long block test (debug_tools, #343, #355): a long two-stage burn whose half-delta-v point is past the
# first stage. reference.craft is the launch_orbit craft (two FL-T800 + LV-T45 stages, a Small Inline Reaction Wheel
# to turn with), spawned in a 100 km circular orbit with no stage fired, except that its first stage's tank is
# drained to 45% (162 of 360 LiquidFuel, 198 of 440 Oxidizer; edited in the craft file, no VAB). Worked by hand from
# stock figures (LV-T45 vacuum Isp 320 s, 200 kN; FL-T800 4.5 t full, 0.5 t dry; 8.79 t of craft and second stage
# above the drained tank, 6.45 t at the second stage's start):
#   first stage    10.59 t -> 8.79 t: about 585 m/s, about 28 s   (with the tank full it held about 1180 m/s)
#   second stage   6.45 t: about 3000 m/s in all; the node needs about 1415 m/s of it, about 37 s
# exec_node flies a 2000 m/s normal node 10 minutes ahead, so the first stage holds under a third of it and the
# half-delta-v point (1000 m/s) falls 415 m/s into the second stage. Half the delta-v takes well over half the
# burn's time, so "node minus half the burn" would start late; a lead worked out from the current stage alone
# would run past the first stage's fuel to find the half (1000 m/s against its 585); the burn start worked out
# from both stages must start on time (late_start_s == 0). test.ks records the first stage's delta-v as
# test_stage1_dv and the checks below hold it under half the node's, so a change to the craft that breaks the
# setup fails here instead of passing for the wrong reason. The burn stays bound to Kerbin (about 3000 m/s
# against 3176 m/s to escape). The in-game run (KSP, debug_tools) is the human's: look for late_start_s 0,
# stage 2, a burn_time near 65 s, and test_stage1_dv near 585.
block = exec_node
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: the node is 10 minutes of game time ahead.
timeout_s = 600
check = success == true
check = residual < 0.5
check = node_dv > 1900
# The scenario as written (#355): the first stage holds well under half the node's 2000 m/s, and is still a real stage.
check = test_stage1_dv < 1000
check = test_stage1_dv > 300
check = dv_used > 1900
# Both stages burned: stage 4's engine, then the decoupler at 3 into stage 2's.
check = stage == 2
# Both stages burned: the first alone is about 28 s, the whole burn about 65 s.
check = burn_time > 45
check = burn_time < 120
check = orbit.inc > 30
# Spec #314's targets: the burn starts on time, and the craft was aligned before every warp.
check = late_start_s == 0
check = not_aligned == 0
# The turn took no longer than TURNTIME predicted (test.ks compares them).
check = test_turn_within == true
# The craft turns to the node before it warps: 10 s plus the turn (at most 120 s) to the first request.
check = warp.first_request_real_s < 130
# Spec #314's "1x inside a wait", as #405 changed it: the turn above happens outside the wait, and once
# Aligned the warp ends 30 s before the Burn Start (not max(30 s, turn_time)), so about 30 s at 1x plus
# stock WarpTo's slow-down near its target (unmeasured, hence the margin).
check = warp.real_s_at_1x < 60
