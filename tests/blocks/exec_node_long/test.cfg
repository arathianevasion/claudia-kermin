# exec_node_long block test (debug_tools, #343): a long two-stage burn. reference.craft is the launch_orbit
# craft (two FL-T800 + LV-T45 stages, a Small Inline Reaction Wheel to turn with), spawned in a 100 km
# circular orbit with no stage fired. exec_node flies a 2000 m/s normal node 10 minutes ahead: the first
# stage's ~1100 m/s burns slowly at full mass, then it stages into the second. Half the delta-v takes well
# over half the burn's time, so "node minus half the burn" would start late; the burn start worked out
# from both stages must not. The burn stays bound to Kerbin (about 3000 m/s against 3176 m/s to escape).
block = exec_node
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: the node is 10 minutes of game time ahead.
timeout_s = 600
check = success == true
check = residual < 0.5
check = node_dv > 1900
check = dv_used > 1900
# Both stages burned: stage 4's engine, then the decoupler at 3 into stage 2's.
check = stage == 2
check = orbit.inc > 30
# Spec #314's targets: the burn starts on time, and the craft was aligned before every warp.
check = late_start_s == 0
check = not_aligned == 0
# The turn took no longer than TURNTIME predicted (test.ks compares them).
check = test_turn_within == true
# The craft turns to the node before it warps: 10 s plus the turn (at most 120 s) to the first request.
check = warp.first_request_real_s < 130
