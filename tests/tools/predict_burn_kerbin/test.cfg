# predict_burn scenario (tests/tools, debug_tools). The runner loads scenario.sfs, spawns reference.craft into a circular
# orbit, opens the test-only Planning Tool bridge to its processor, runs test.ks bundled with the Core Library, and judges
# its Script Result below. The script asks predict_burn, flies the burn with exec_node, and reports predicted against
# actual; the report, each call and its timing against the frame budget go to KSP.log.
# Spec #265: Ap and Pe within 1% of a stock node flown, the same transition. A stable orbit here.
block = exec_node
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: the burn is 5 minutes of game time ahead.
timeout_s = 600
check = success == true
check = ap_error_pct < 1
check = pe_error_pct < 1
check = transition_match == true
# Against stock's own patched conics for the same node, read before it is flown.
check = node_ap_error_pct < 1
check = node_pe_error_pct < 1
check = node_transition_match == true
# Logged, not judged: the call's time on the main thread (KSP.log has it against the frame budget).
check = call_ms > 0
