# solve_burn scenario (tests/tools, debug_tools): see predict_burn_kerbin/test.cfg for how it runs. The runner loads
# scenario.sfs, spawns reference.craft into a circular orbit, opens the test-only Planning Tool bridge to its processor, runs
# test.ks bundled with the Core Library, and judges its Script Result below. The script asks solve_burn for an Ap of 250 km,
# flies it with exec_node, then asks for the circularizing burn at that Ap and flies that; the report, each call and its
# timing against the frame budget go to KSP.log.
# Spec #265: the closed-form goals match vis-viva, so the flown orbit meets the target; 1% allows for the finite burn.
block = exec_node
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: half an orbit of game time between the two burns.
timeout_s = 900
check = success == true
check = ap_error_pct < 1
check = pe_error_pct < 1
check = circle_ap_error_pct < 1
check = circle_pe_error_pct < 1
# Sanity checks that solve_burn answered both times, and the call's time on the main thread (KSP.log has it against the frame budget).
check = solved_first_dv > 0
check = solved_second_dv > 0
check = call_ms > 0
