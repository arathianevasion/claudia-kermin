# find_landing_site scenario at Minmus (tests/tools, debug_tools): see find_landing_site_mun/test.cfg for how it runs. A 30 km
# circular equatorial Minmus orbit; Minmus is small and rotates once in 40400 s, so the ground track slips under the craft and its
# flats and biomes (Flats, Lowlands, Slopes) are the ones to find.
block = land
craft = reference.craft
orbit_body = Minmus
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: the warp to the pass over the sub-solar point is about half an orbit (under an hour of game time).
timeout_s = 600
check = success == true
check = sites_any > 0
check = biome_misses == 0
check = terrain_worst_m < 1
check = sites_named > 0
check = named_wrong_biome == 0
check = named_biome_misses == 0
check = named_terrain_worst_m < 1
check = near_biome_misses == 0
check = near_terrain_worst_m < 1
check = track_error_m < 2000
# Logged, not judged beyond being there: each call's time on the main thread (KSP.log has it against the frame budget).
check = call_ms_any > 0
check = call_ms_named > 0
check = call_ms_near > 0
check = slope_worst_deg <= 10
check = near_sun_low_deg >= 5
# The tool's sun elevation agrees with KSP's own at the site and pass UT (#312).
check = near_sun_error_deg < 3
