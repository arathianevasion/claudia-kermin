# find_landing_site scenario at the Mun (tests/tools, debug_tools). The runner loads scenario.sfs, spawns reference.craft into a
# 30 km circular equatorial Mun orbit, opens the test-only Planning Tool bridge to its processor, runs test.ks bundled with the
# Core Library, and judges its Script Result below. The script asks find_landing_site three ways, reads KSP's own biome and
# terrain height at every site it gives, and warps to one pass to compare the craft's ground track with the site. It flies nothing.
# Spec #265: the biome and terrain must match KSP at the spot. The block line only names a block for the runner; none is flown.
block = land
craft = reference.craft
orbit_body = Mun
orbit_altitude = 30000
orbit_inclination = 0
# Real seconds, warp included: the warp to the far-side pass is about half an orbit (under 30 min of game time).
timeout_s = 600
check = success == true
check = sites_any > 0
check = biome_misses == 0
check = terrain_worst_m < 1
check = sites_named > 0
check = named_wrong_biome == 0
check = named_biome_misses == 0
check = named_terrain_worst_m < 1
check = near_biome_misses == 0
check = near_terrain_worst_m < 1
# The craft really is over the site at its pass (the ground track and the body's rotation are right): within 2 km on the surface.
check = track_error_m < 2000
# Logged, not judged beyond being there: each call's time on the main thread (KSP.log has it against the frame budget).
check = call_ms_any > 0
check = call_ms_named > 0
check = call_ms_near > 0
check = slope_worst_deg <= 10
check = near_sun_low_deg >= 5
