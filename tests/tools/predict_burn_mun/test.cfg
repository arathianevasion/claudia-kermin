# predict_burn scenario (tests/tools, debug_tools): see predict_burn_kerbin/test.cfg for how it runs.
# A Hohmann burn to the Mun, timed from the phase angle; the prediction must show the Mun encounter the flight gets.
# Spec #265: Ap and Pe within 1% of the flown burn, the same transition.
block = exec_node
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
# Real seconds, warp included: up to a synodic period (about 2000 s of game time) to the window.
timeout_s = 900
check = success == true
check = ap_error_pct < 1
check = pe_error_pct < 1
check = transition_match == true
check = predicted_next_body == Mun
check = actual_next_body == Mun
# Logged, not judged: the Mun periapsis predicted and flown, the closest approach, and the call's time on the main thread
# (KSP.log has it against the frame budget). The encounter search makes this the slowest predict_burn call.
check = actual_next_pe > -1e9
check = predicted_next_pe > -1e9
check = predicted_closest_altitude > -1e9
check = call_ms > 0
