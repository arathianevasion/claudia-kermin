# predict_burn scenario (tests/tools, debug_tools): see predict_burn_kerbin/test.cfg for how it runs.
# A 1000 m/s prograde burn from 100 km, past Kerbin's escape speed: an escape (or a Mun encounter if the Mun is in the way;
# either passes as long as prediction and flight agree). An escape has no Ap, so ap_error_pct reads -1, not compared.
block = exec_node
craft = reference.craft
orbit_body = Kerbin
orbit_altitude = 100000
orbit_inclination = 0
timeout_s = 600
check = success == true
check = ap_error_pct < 1
check = pe_error_pct < 1
check = transition_match == true
# Against stock's own patched conics for the same node, read before it is flown.
check = node_ap_error_pct < 1
check = node_pe_error_pct < 1
check = node_transition_match == true
# Logged, not judged: the call's time on the main thread (KSP.log has it against the frame budget).
check = call_ms > 0
