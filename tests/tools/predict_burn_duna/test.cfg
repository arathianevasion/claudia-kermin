# predict_burn scenario (tests/tools, debug_tools): see predict_burn_kerbin/test.cfg for how it runs.
# The atmosphere patch end at Duna (50 km atmosphere): a retrograde burn from 100 km lowers Pe to 25 km. The predicted
# patch must end "atmosphere" and the flown periapsis be inside the atmosphere.
block = exec_node
craft = reference.craft
orbit_body = Duna
orbit_altitude = 100000
orbit_inclination = 0
timeout_s = 600
check = success == true
check = ap_error_pct < 1
check = pe_error_pct < 1
check = transition_match == true
check = actual_pe < 50000
# Logged, not judged: the call's time on the main thread (KSP.log has it against the frame budget).
check = call_ms > 0
