# SPDX-License-Identifier: GPL-3.0-or-later
#
# CI has no KSP, so it builds and tests the Unity-free core only, and compiles the shipped
# kerboscript with kOS.Safe taken from the public kOS release. The adapter and kOS addon
# need a local KSP install and are built on a developer machine (see README, Building).
# The compile check only proves the kerboscript compiles; the Script Check (ADR 0003) is separate.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # kOS release whose kOS.Safe.dll compiles the kerboscript; keep in step with the supported kOS.
  KOS_RELEASE_TAG: 1.6.0.1

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and test the core
        run: dotnet test tests/ClaudiaKermin.Core.Tests -c Release

      - name: Fetch kOS.Safe from the kOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/kos"
          gh release download "$KOS_RELEASE_TAG" --repo KSP-KOS/KOS --pattern '*.zip' --dir "$RUNNER_TEMP/kos"
          for zip in "$RUNNER_TEMP"/kos/*.zip; do
            unzip -q -o "$zip" -d "$RUNNER_TEMP/kos/unpacked"
          done
          safe=$(find "$RUNNER_TEMP/kos/unpacked" -name kOS.Safe.dll | head -n 1)
          if [ -z "$safe" ]; then echo "kOS.Safe.dll not found in the $KOS_RELEASE_TAG release"; exit 1; fi
          echo "KOS_PLUGINS_DIR=$(dirname "$safe")" >> "$GITHUB_ENV"

      - name: Build the kerboscript compile check
        run: dotnet build tools/ClaudiaKermin.KsCompile -c Release -p:KOSPluginsDir="$KOS_PLUGINS_DIR"

      - name: Compile the shipped kerboscript and the block test scripts
        run: dotnet run --project tools/ClaudiaKermin.KsCompile -c Release --no-build -- kerboscript tests/blocks

      - name: Test the Core Library on kOS.Safe
        run: dotnet test tests/ClaudiaKermin.Kerboscript.Tests -c Release -p:KOSPluginsDir="$KOS_PLUGINS_DIR"

      - name: Check that a syntax error fails the compile check
        run: |
          if dotnet run --project tools/ClaudiaKermin.KsCompile -c Release --no-build -- tools/ClaudiaKermin.KsCompile/fixtures/syntax-error.ks; then
            echo "The compile check passed a file with a syntax error"
            exit 1
          fi
